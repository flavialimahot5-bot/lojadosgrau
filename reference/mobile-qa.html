<!doctype html><meta charset="utf-8"><title>Conferência mobile</title><style>body{margin:0;background:#ddd;display:flex;gap:16px;align-items:start}iframe{border:0;flex:none;background:white;width:390px;height:844px}</style><iframe title="Legging" src="/p/4575.html"></iframe><iframe title="Macaquinho" src="/p/4576.html"></iframe><iframe title="Whey" src="/p/185.html"></iframe>
<script>
function measure(){document.getElementById('metrics').textContent=JSON.stringify([...document.querySelectorAll('iframe')].map(f=>{const d=f.contentDocument,w=f.contentWindow;let h=d?.querySelector('h1'),chain=[];for(let e=h;e&&chain.length<7;e=e.parentElement){let s=w.getComputedStyle(e),r=e.getBoundingClientRect();chain.push({tag:e.tagName,cls:e.className,width:r.width,display:s.display,grid:s.gridTemplateColumns,flex:s.flex})}return{title:f.title,width:d?.documentElement.clientWidth,scroll:d?.documentElement.scrollWidth,chain,overflow:[...d.querySelectorAll('main *')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.right>395}).slice(0,15).map(e=>({cls:e.className,width:e.getBoundingClientRect().width,right:e.getBoundingClientRect().right})),images:[...d.querySelectorAll('.imagem-produto-default')].slice(0,1).map(e=>({cls:e.parentElement.parentElement.className,display:w.getComputedStyle(e.parentElement.parentElement).display}))}}),null,2)}
setInterval(measure,2000);
</script><pre id="metrics" style="min-width:550px"></pre>
<style>nav{position:fixed;right:0;top:0;background:white;padding:8px;z-index:10;display:flex;gap:8px}</style><nav><button onclick="jump('.product__info,.topo__box-direito')">Ver compra</button><button onclick="jump('.cards__item')">Ver cards</button><button onclick="jump('h1')">Ver título</button></nav><script>function jump(selector){document.querySelectorAll('iframe').forEach(f=>f.contentDocument.querySelector(selector)?.scrollIntoView({block:'start'}))}</script>
<script>function jump(selector){document.querySelectorAll('iframe').forEach(f=>{const e=f.contentDocument.querySelector(selector);if(e)f.contentWindow.scrollTo(0,e.getBoundingClientRect().top+f.contentWindow.scrollY)});window.scrollTo(0,0)}</script>
