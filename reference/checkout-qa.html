<!doctype html><meta charset="utf-8"><iframe style="border:0;height:844px"></iframe><pre id="results">Em andamento</pre><script>
const frame=document.querySelector('iframe'),key='growth-cart-v1',original=localStorage.getItem(key),results=[];const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function load(path,width){frame.style.width=width+'px';frame.src=path;await new Promise(r=>frame.onload=r);for(let n=0;n<100;n++){const d=frame.contentDocument;if(d.querySelector('#loading')?.hidden||d.querySelector('.store-header-mobile'))break;await wait(50)}await wait(200);return frame.contentDocument}
async function run(){try{const catalog=await(await fetch('/data/catalog.json')).json();const kit=catalog.find(p=>p.id==='4092'),clothing=catalog.find(p=>p.id==='4576');const fixture=[{id:kit.id,key:'qa-kit',quantity:2,price:kit.price,image:kit.images[0],options:{Sabor:'Chocolate'}},{id:clothing.id,key:'qa-clothing',quantity:1,price:clothing.price,image:clothing.images[0],options:{Tamanho:'M'}}];for(const width of [320,390,430,1280]){localStorage.setItem(key,JSON.stringify(fixture));const d=await load('/checkout.html',width),w=frame.contentWindow;const fill=(id,value)=>{const e=d.getElementById(id);e.value=value;e.dispatchEvent(new w.Event('input',{bubbles:true}))};const row={width,viewport:d.documentElement.clientWidth,scroll:d.documentElement.scrollWidth,items:d.querySelectorAll('.order-item').length,total:d.querySelector('[data-subtotal]').textContent,options:d.querySelector('#order-items').textContent.includes('Chocolate')&&d.querySelector('#order-items').textContent.includes('M')};fill('name','Pessoa de Teste');fill('email','qa@example.test');fill('document','11111111111');fill('phone','11999999999');d.querySelector('#identity-form').requestSubmit();row.invalidBlocked=!d.querySelector('#step-1').hidden;fill('document','52998224725');d.querySelector('#identity-form').requestSubmit();row.delivery=!d.querySelector('#step-2').hidden;for(const [id,value] of Object.entries({zip:'01001000',street:'Endereço de teste',number:'123',district:'Centro',city:'São Paulo',state:'SP'}))fill(id,value);d.querySelector('#address-form').requestSubmit();row.payment=!d.querySelector('#step-3').hidden;row.noCharge=d.querySelector('#step-3 .primary').disabled;row.address=d.querySelector('#address-review').textContent.includes('01001-000');d.querySelector('#step-3 [data-back="1"]').click();row.editRetained=d.querySelector('#name').value==='Pessoa de Teste'&&!d.querySelector('#step-1').hidden;row.noPersonalStorage=!JSON.stringify({...localStorage}).includes('qa@example.test');for(let n=0;n<40&&d.querySelector('#product-reviews').hidden;n++)await wait(50);row.productReviews=!d.querySelector('#product-reviews').hidden&&d.querySelector('#review-cards').textContent.includes('Alan L.');row.pass=row.scroll<=row.viewport+1&&row.items===2&&row.options&&row.total===((kit.price*2+clothing.price)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})&&row.invalidBlocked&&row.delivery&&row.payment&&row.noCharge&&row.address&&row.editRetained&&row.noPersonalStorage&&row.productReviews;results.push(row)}for(const value of ['[]','not-json']){localStorage.setItem(key,value);const d=await load('/checkout.html',390);results.push({case:value,pass:!d.querySelector('#empty').hidden&&d.querySelector('#checkout-layout').hidden})}
localStorage.setItem(key,JSON.stringify(fixture));await wait(400);const d=await load('/p/4576.html',390);for(let n=0;n<100&&!frame.contentWindow.GrowthStore;n++)await wait(50);frame.contentWindow.GrowthStore.openCart();const button=d.querySelector('[data-review]');button.click();await wait(500);results.push({case:'drawer-route',path:frame.contentWindow.location.pathname,pass:frame.contentWindow.location.pathname==='/checkout.html'});
}catch(e){results.push({error:e.message,path:frame.contentWindow.location.pathname,pass:false})}finally{if(original===null)localStorage.removeItem(key);else localStorage.setItem(key,original);document.querySelector('#results').textContent=JSON.stringify({complete:true,results})}}run();</script>
