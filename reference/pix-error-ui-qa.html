const f=document.querySelector('iframe'),key='growth-cart-v1',sessionKey='growth-pix-order-v1',old=localStorage.getItem(key),oldSession=sessionStorage.getItem(sessionKey),results=[],wait=t=>new Promise(r=>setTimeout(r,t));async function run(){try{const catalog=await(await fetch('/data/catalog.json')).json(),p=catalog.find(p=>p.id==='4576');localStorage.setItem(key,JSON.stringify([{id:p.id,quantity:1,price:p.price,options:{Tamanho:'M'},image:p.images[0]}]));for(const width of [320,390]){sessionStorage.removeItem(sessionKey);f.style.width=width+'px';f.src='/pix-ui-fixture.html?rejected=1';await new Promise(r=>f.onload=r);let d=f.contentDocument,w=f.contentWindow;const until=async fn=>{for(let i=0;i<100&&!fn();i++)await wait(50)};await until(()=>!!w.checkoutCart);const fill=(id,v)=>{d.getElementById(id).value=v;d.getElementById(id).dispatchEvent(new w.Event('input',{bubbles:true}))};for(const [id,v]of Object.entries({name:'Pessoa Teste',email:'qa@example.test',document:'52998224725',phone:'11999999999'}))fill(id,v);d.querySelector('#identity-form').requestSubmit();fill('zip','01001000');await until(()=>d.querySelector('#street').value);fill('number','1');d.querySelector('[value=sedex]').click();d.querySelector('#address-form').requestSubmit();await until(()=>!d.querySelector('#generate-pix').disabled);const row={width,quoteAmount:d.querySelector('#pix-amount').textContent,shipping:d.querySelector('#shipping-total').textContent};d.querySelector('#generate-pix').click();d.querySelector('#generate-pix').click();await until(()=>!d.querySelector('#pix-review-rejected').hidden);row.message=d.querySelector('#pix-message').textContent;row.reviewVisible=!d.querySelector('#pix-review-rejected').hidden;row.pixHidden=d.querySelector('#pix-code-panel').hidden;row.creates=w.pixTest.creates;row.noOverflow=d.documentElement.scrollWidth<=d.documentElement.clientWidth+1;row.pass=row.message.includes('IRONPAY_HTTP_422')&&row.reviewVisible&&row.pixHidden&&row.creates===1&&row.noOverflow;results.push(row)}}catch(e){results.push({error:e.message,pass:false})}finally{if(old===null)localStorage.removeItem(key);else localStorage.setItem(key,old);if(oldSession===null)sessionStorage.removeItem(sessionKey);else sessionStorage.setItem(sessionKey,oldSession);document.querySelector('#results').textContent=JSON.stringify({complete:true,results})}}run();</script>
