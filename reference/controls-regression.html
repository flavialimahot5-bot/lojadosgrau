<!doctype html><meta charset="utf-8"><iframe style="border:0;height:844px"></iframe><pre id="results"></pre><script>
const f=document.querySelector('iframe'),results=[];async function run(){for(const width of [320,390,430,500])for(const path of ['/p/4575.html','/p/4576.html','/pm/4092.html','/p/4092.html']){f.style.width=width+'px';f.src=path;await new Promise(r=>f.onload=r);await new Promise(r=>setTimeout(r,400));const d=f.contentDocument,w=f.contentWindow,v=d.documentElement.clientWidth;const rect=s=>{const e=d.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect();return {left:r.left,width:r.width}};const button=rect('.product__info .botaoComprar'),selector=rect('.product__info .attrSimples__attrSelecionado');const stars=d.querySelector('#trustvox .ts-v-stars-foreground');const review=d.querySelector('#trustvox .ts-review');const row={path,width,viewport:v,scroll:d.documentElement.scrollWidth,button,selector,stars:stars?{position:w.getComputedStyle(stars).position,height:stars.getBoundingClientRect().height}:null,wordBreak:review?w.getComputedStyle(review).wordBreak:null};row.pass=row.scroll<=v+1&&(!button||!selector||(Math.abs(button.left-selector.left)<2&&Math.abs(button.width-selector.width)<2))&&(!stars||(row.stars.position==='absolute'&&row.stars.height===20))&&(!review||row.wordBreak==='normal');results.push(row);document.querySelector('#results').textContent=JSON.stringify({complete:false,results})}document.querySelector('#results').textContent=JSON.stringify({complete:true,results})}run();</script>
