<!doctype html><meta charset="utf-8"><title>Verificação de layout</title><style>body{font:14px Arial;margin:0}iframe{border:0;height:844px}pre{white-space:pre-wrap}</style><iframe title="Página em teste"></iframe><pre id="results">Em andamento</pre><script>
const frame=document.querySelector('iframe'),results=[];
const paths=['/p/4575.html','/p/4576.html','/p/2712.html','/p/185.html','/p/72.html','/p/4074.html','/catalogo.html?categoria=%2Fcreatina','/mobile.html'];
async function run(){for(const width of [320,390,430])for(const path of paths){frame.style.width=width+'px';frame.src=path;await new Promise(resolve=>{let rounds=0;const timer=setInterval(()=>{const d=frame.contentDocument;if(++rounds>100||(d?.location.pathname===path.split('?')[0]&&d.readyState!=='loading'&&[...d.querySelectorAll('link[rel=stylesheet]')].every(l=>l.sheet))){clearInterval(timer);resolve()}},100)});await new Promise(r=>setTimeout(r,350));const d=frame.contentDocument,w=frame.contentWindow,v=d.documentElement.clientWidth;const h=d.querySelector('h1');const cards=[...d.querySelectorAll('.cards__item')].map(c=>{const cr=c.getBoundingClientRect();return{width:Math.round(cr.width),left:Math.round(cr.left),right:Math.round(cr.right),parts:[...c.children].map(e=>Math.round(e.getBoundingClientRect().width))}});const row={path,width,viewport:v,scroll:d.documentElement.scrollWidth,titleWidth:h?Math.round(h.getBoundingClientRect().width):null,cards};row.pass=row.scroll<=v+1&&(!path.startsWith('/p/')||!h||row.titleWidth>v*.6)&&cards.every(c=>c.left>=-1&&c.right<=v+1&&c.parts.every(n=>Math.abs(n-c.width)<=2));results.push(row);document.getElementById('results').textContent=JSON.stringify({complete:false,results},null,2)}document.getElementById('results').textContent=JSON.stringify({complete:true,results},null,2)}run();
</script>
