<!doctype html><meta charset="utf-8"><style>body{margin:0}iframe{border:0;width:390px;height:844px}pre{white-space:pre-wrap}</style><iframe></iframe><pre id="results">Em andamento</pre><script>
const f=document.querySelector('iframe'),key='growth-cart-v1',old=localStorage.getItem(key),results=[],wait=t=>new Promise(r=>setTimeout(r,t));
async function run(){try{const cat=await(await fetch('/data/catalog.json')).json(),p=cat.find(x=>x.id==='4092');localStorage.setItem(key,JSON.stringify([{id:p.id,quantity:1,price:p.price,options:{},image:p.images[0]}]));f.src='/checkout.html';await new Promise(r=>f.onload=r);const d=f.contentDocument,w=f.contentWindow;for(let i=0;i<80&&d.querySelector('#state').options.length<28;i++)await wait(50);const zip=d.querySelector('#zip');const type=value=>{zip.value=value;zip.dispatchEvent(new w.Event('input',{bubbles:true}))};const until=async test=>{for(let n=0;n<120&&!test();n++)await wait(100)};
// One real public CEP lookup verifies the browser service integration.
type('01001000');await until(()=>d.querySelector('#zip-status').textContent.includes('Informe o número')||d.querySelector('#zip-status').textContent.includes('manualmente'));
results.push({case:'live-postcode',street:d.querySelector('#street').value,city:d.querySelector('#city').value,state:d.querySelector('#state').value,pass:d.querySelector('#street').value==='Praça da Sé'&&d.querySelector('#city').value==='São Paulo'&&d.querySelector('#state').value==='SP'&&d.querySelector('#number').value===''});
const realFetch=w.fetch.bind(w);let mode='missing',resolveOld;w.fetch=(url,options)=>String(url).startsWith('https://viacep.com.br/')?mode==='missing'?Promise.resolve({ok:true,json:async()=>({erro:true})}):mode==='offline'?Promise.reject(Error('offline')):mode==='partial'?Promise.resolve({ok:true,json:async()=>({localidade:'Cidade Teste',uf:'SC'})}):new Promise(r=>resolveOld=r):realFetch(url,options);
type('99999999');await until(()=>d.querySelector('#zip-status').textContent.includes('não encontrado'));results.push({case:'missing',pass:d.querySelector('#zip-status').textContent.includes('não encontrado')&&!d.querySelector('#street').value});
mode='offline';type('11111111');await until(()=>d.querySelector('#zip-status').textContent.includes('manualmente'));results.push({case:'offline-manual',pass:d.querySelector('#zip-status').textContent.includes('manualmente')&&!d.querySelector('#street').disabled});
mode='partial';type('22222222');await until(()=>d.querySelector('#city').value==='Cidade Teste');results.push({case:'city-only-cep',pass:d.querySelector('#city').value==='Cidade Teste'&&!d.querySelector('#street').value&&d.querySelector('#zip-status').textContent.includes('em branco')});
mode='slow';type('33333333');await until(()=>!!resolveOld);type('444');resolveOld({ok:true,json:async()=>({logradouro:'Resposta antiga',bairro:'Antigo',localidade:'Antiga',uf:'RJ'})});await wait(100);results.push({case:'stale-response',pass:d.querySelector('#street').value!=='Resposta antiga'&&d.querySelector('#city').value!=='Antiga'});
for(const width of [320,390,430,1280]){f.style.width=width+'px';await wait(50);const footer=d.querySelector('.checkout-footer');results.push({case:'footer',width,images:footer.querySelectorAll('.payment-brands img').length,pass:d.documentElement.scrollWidth<=d.documentElement.clientWidth+1&&footer.querySelectorAll('.payment-brands img').length===12})}
}catch(e){results.push({error:e.message,pass:false})}finally{if(old===null)localStorage.removeItem(key);else localStorage.setItem(key,old);document.querySelector('#results').textContent=JSON.stringify({complete:true,results})}}run();</script>
